<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Bhargav Gandhi — AI Data Engineer">
  <defs>
    <radialGradient id="glowA" cx="78%" cy="8%" r="60%">
      <stop offset="0" stop-color="#4b3f7a"/>
      <stop offset="1" stop-color="#4b3f7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="12%" cy="100%" r="60%">
      <stop offset="0" stop-color="#10406a"/>
      <stop offset="1" stop-color="#10406a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2240"/>
      <stop offset="1" stop-color="#0d1a35"/>
    </linearGradient>
    <clipPath id="win"><rect x="150" y="48" width="900" height="304" rx="14"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .p { fill: #8ad17a; }
      .c { fill: #e6e9ee; }
      .k { fill: #3daee9; }
      .m { fill: #9aa3ad; }
      .y { fill: #e5c07b; }
      .l { opacity: 0; animation: show .01s forwards; }
      .l1 { animation-delay: .3s; }  .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.3s; } .l4 { animation-delay: 2.0s; }
      .l5 { animation-delay: 2.7s; } .l6 { animation-delay: 3.4s; }
      .l7 { animation-delay: 4.1s; }
      @keyframes show { to { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; animation-delay: 4.1s; opacity: 0; }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
      .dots circle { opacity: .9; }
    </style>
  </defs>

  <!-- wallpaper -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glowA)"/>
  <rect width="1200" height="400" fill="url(#glowB)"/>

  <!-- window -->
  <rect x="150" y="56" width="900" height="304" rx="14" fill="#000" opacity=".35"/>
  <g clip-path="url(#win)">
    <rect x="150" y="48" width="900" height="304" fill="#1c1f24"/>
    <rect x="150" y="48" width="900" height="40" fill="#1f2226"/>
    <line x1="150" y1="88" x2="1050" y2="88" stroke="#ffffff" stroke-opacity=".06"/>
  </g>
  <rect x="150.5" y="48.5" width="899" height="303" rx="14" fill="none" stroke="#3daee9" stroke-opacity=".45"/>

  <!-- titlebar -->
  <g transform="translate(172 68)">
    <rect x="-2" y="-9" width="18" height="18" rx="4" fill="none" stroke="#3daee9" stroke-width="1.8"/>
    <path d="M2 -3 l4 3 -4 3 M8 3 h5" stroke="#3daee9" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <text x="200" y="73" class="sans c" font-size="14" font-weight="600">bhargav@lakehouse: ~</text>
  <g class="dots" transform="translate(986 68)" stroke="#9aa3ad" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M-4 0 h8"/>
    <rect x="18" y="-5" width="10" height="10" rx="1"/>
    <path d="M42 -5 l10 10 M52 -5 l-10 10"/>
  </g>

  <!-- terminal body -->
  <g class="mono" font-size="17">
    <text x="178" y="124" class="l l1"><tspan class="p">[bhargav@lakehouse ~]$</tspan><tspan class="c"> whoami</tspan></text>
    <text x="178" y="168" class="l l2 sans c" font-size="36" font-weight="700">Bhargav Gandhi</text>
    <text x="178" y="198" class="l l3"><tspan class="k">AI Data Engineer</tspan><tspan class="m">  ·  Boston, MA  ·  MS Software Engineering, Northeastern</tspan></text>
    <text x="178" y="238" class="l l4"><tspan class="p">[bhargav@lakehouse ~]$</tspan><tspan class="c"> cat stack.txt</tspan></text>
    <text x="178" y="264" class="l l5"><tspan class="y">Databricks</tspan><tspan class="m"> · </tspan><tspan class="y">Spark</tspan><tspan class="m"> · </tspan><tspan class="y">dbt</tspan><tspan class="m"> · </tspan><tspan class="y">Delta Lake</tspan><tspan class="m"> · </tspan><tspan class="y">Python</tspan><tspan class="m"> · </tspan><tspan class="y">SQL</tspan><tspan class="m"> · </tspan><tspan class="y">LangGraph</tspan></text>
    <text x="178" y="304" class="l l6"><tspan class="p">[bhargav@lakehouse ~]$</tspan><tspan class="c"> open </tspan><tspan class="k" text-decoration="underline">bhargavgandhi.me</tspan></text>
    <text x="178" y="334" class="l l7"><tspan class="p">[bhargav@lakehouse ~]$</tspan></text>
    <rect x="404" y="320" width="10" height="19" fill="#e6e9ee" class="cursor"/>
  </g>
</svg>
